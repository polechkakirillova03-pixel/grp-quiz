<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Тренажёр ГРП 🍃</title>
<style>
  :root {
    --green-dark: #1e4620;
    --green: #2e7d32;
    --green-light: #a5d6a7;
    --bg: #eef7ee;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--bg); color: #1d2433;
    display: flex; height: 100vh; overflow: hidden;
  }

  /* --- Боковая панель --- */
  #sidebar {
    width: 260px; background: var(--green-dark); color: white;
    display: flex; flex-direction: column; transition: transform 0.3s;
    z-index: 10;
  }
  #sidebar h2 { margin: 0; padding: 20px 16px 10px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #q-list { flex: 1; overflow-y: auto; padding: 10px; margin: 0; list-style: none; }
  #q-list li {
    padding: 8px 12px; margin-bottom: 4px; border-radius: 6px;
    cursor: pointer; font-size: 14px; transition: background 0.2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #q-list li:hover { background: rgba(255,255,255,0.15); }
  #q-list li.active { background: var(--green-light); color: var(--green-dark); font-weight: bold; }

  /* --- Основной контент --- */
  #main-content {
    flex: 1; display: flex; flex-direction: column; overflow-y: auto;
    padding: 20px; position: relative;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 10px;
  }
  header h1 { margin: 0; font-size: 22px; color: var(--green-dark); display: flex; align-items: center; gap: 8px;}
  #menu-btn {
    display: none; background: var(--green); border: none; color: white;
    font-size: 20px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }

  .card {
    background: var(--card-bg); border-radius: 12px; padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 800px; width: 100%; margin: 0 auto;
  }
  
  #start-screen label { display: block; margin: 15px 0; font-size: 16px; }
  select {
    padding: 10px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 16px; margin-top: 5px; width: 100%; max-width: 300px;
  }
  .btn {
    padding: 12px 24px; border: none; border-radius: 8px;
    background: var(--green); color: white; font-size: 16px;
    cursor: pointer; transition: background 0.2s; margin-top: 10px;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:disabled { background: #b9c4d0; cursor: default; }
  .btn-outline {
    background: transparent; color: var(--green);
    border: 2px solid var(--green);
  }
  .btn-outline:hover { background: var(--green); color: white; }

  .q-meta { display: flex; justify-content: space-between; font-size: 13px; color: #6b7785; margin-bottom: 8px; }
  #q-text { margin: 0 0 20px; font-size: 19px; line-height: 1.4; color: #111; }
  
  .option {
    display: block; width: 100%; text-align: left; margin: 10px 0;
    padding: 14px 16px; border: 2px solid #c8e6c9; border-radius: 10px;
    background: #f1f8e9; cursor: pointer; font-size: 16px;
    transition: all 0.2s; color: #1d2433; line-height: 1.3;
  }
  .option:hover { border-color: var(--green); background: #dcedc8; }
  .option.selected { border-color: var(--green); background: #c8e6c9; box-shadow: 0 0 0 2px rgba(46,125,50,0.2); }
  .option.correct { border-color: #2e7d32; background: #c8e6c9; color: #1b5e20; font-weight: 500; }
  .option.wrong { border-color: #d32f2f; background: #ffebee; color: #b71c1c; }
  
  .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .feedback { margin-top: 16px; padding: 14px; border-radius: 8px; background: #f1f8e9; font-size: 15px; border-left: 4px solid var(--green); }
  .feedback.ok { background: #e8f5e9; border-left-color: #2e7d32; }
  .feedback.bad { background: #ffebee; border-left-color: #d32f2f; }
  textarea {
    width: 100%; min-height: 100px; padding: 12px;
    border: 2px solid #c8e6c9; border-radius: 8px; font: inherit;
    background: #f1f8e9; resize: vertical;
  }
  
  img.q-img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; display: block; border: 1px solid #ccc; }

  @media (max-width: 768px) {
    body { flex-direction: column; height: auto; overflow: auto; }
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; width: 280px;
      transform: translateX(-100%); box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }
    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: block; }
    #main-content { padding: 15px; }
    .card { padding: 18px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <h2>🍃 Вопросы</h2>
  <ul id="q-list"></ul>
</aside>

<div id="main-content">
  <header>
    <h1><span>🌿</span> Тренажёр ГРП</h1>
    <button id="menu-btn">☰ Вопросы</button>
  </header>

  <section id="start-screen" class="card">
    <p>Всего вопросов: <span id="total">…</span></p>
    <label>Режим:
      <select id="mode">
        <option value="all">Все вопросы</option>
        <option value="single">Только одиночные</option>
        <option value="multi">Только множественные</option>
        <option value="open">Только открытые</option>
        <option value="wrong">Только ошибки (из прошлого раза)</option>
      </select>
    </label>
    <p><button id="start-btn" class="btn" disabled>Начать</button></p>
  </section>

  <section id="quiz-screen" class="card" hidden>
    <div class="q-meta">
      <span id="q-counter"></span>
      <span id="q-type"></span>
    </div>
    <div id="q-image-container"></div>
    <h2 id="q-text"></h2>
    <div id="q-options"></div>
    <div id="q-feedback" class="feedback" hidden></div>
    <div class="controls">
      <button id="check-btn" class="btn">Проверить</button>
      <button id="next-btn" class="btn" hidden>Далее →</button>
      <button id="skip-btn" class="btn btn-outline">Пропустить</button>
    </div>
  </section>

  <section id="result-screen" class="card" hidden>
    <h2>Результат</h2>
    <p id="score" style="font-size:18px;"></p>
    <button id="restart-btn" class="btn">Пройти заново</button>
  </section>
</div>

<script>
let QUESTIONS = [
{"id":1,"type":"single","question":"Выберите верное определение коэффициента Пуассона","options":["Отношение поперечной относительной деформации к осевой","Отношение осевой относительной деформации к поперечной","Отношение между относительной деформацией образца и приложенным напряжением"],"answer":[1]},
{"id":2,"type":"single","question":"В каких пределах изменяется коэффициент Пуассона?","options":["От 0 до 1","От 0 до 0.5","От 0.05 до 0.5"],"answer":[1]},
{"id":3,"type":"single","question":"Выберите правильное утверждение относительно модуля Юнга","options":["Статический модуль Юнга всегда выше динамического модуля","Статический модуль Юнга всегда ниже динамического модуля","Статический модуль Юнга обычно равен динамическому модулю"],"answer":[1]},
{"id":4,"type":"single","question":"Выберите правильное утверждение относительно к-та Пуассона","options":["Статический к-т Пуассона всегда выше динамического к-та","Статический к-т Пуассона всегда ниже динамического к-та","Статический к-т Пуассона обычно равен динамическому к-ту"],"answer":[2]},
{"id":5,"type":"single","question":"Влияет ли ориентация отбора керна относительно напластования на анизотропию упругих свойств пород?","options":["Не влияет","Влияет","Влияет только при наличии естественной трещиноватости"],"answer":[1]},
{"id":6,"type":"multi","question":"Укажите основные методы прямых измерений для определения минимального горизонтального напряжения","options":["Расширенный тест на утечку (XLOT)","МикроГРП (MDT)","Пошаговый тест на увеличение расхода (SRT)","МиниГРП (DataFRAC)"],"answer":[1,3]},
{"id":7,"type":"single","question":"Укажите основные методы прямых измерений для определения максимального горизонтального напряжения","options":["Геомеханическое моделирование (численные методы)","Интерпретация давлений формирования трещин при бурении","Моделирование инициации вывалов","Прямых измерений не существует"],"answer":[3]},
{"id":8,"type":"single","question":"Возможно ли построение достоверной подтвержденной геомеханической модели для МГРП?","options":["Возможно, при наличии пилотного ствола и проведении полного комплекса ГИС до и после ГРП в пилотном стволе","Невозможно, геомеханические свойства изменяются в вертикальном и горизонтальном направлениях по стволу скважины, калибровка профиля напряжений не подтверждается","Возможно, при наличии кернового материала горизонтального ствола скважины, наличии пилотного ствола с полным комплексом ГИС до и после ГРП"],"answer":[2],"explain":"Примечание: АКШ важен для определения высоты трещины"},
{"id":9,"type":"multi","question":"Выберите основные каротажи для определения механических свойств пласта","options":["Акустический каротаж","Плотностной каротаж","Гамма-каротаж","Каротажи электрического сопротивления","Термокаротаж"],"answer":[0,1,2]},
{"id":10,"type":"multi","question":"Выберите основные источники снижения качества данных для определения механических свойств пласта","options":["Низкий уровень сигнала прибора","Затухание сигнала","Трещиноватость","Наличие углеводородов","Тонкая слоистость породы","Содержание глинистых минералов","Аномально высокое пластовое давление"],"answer":[1,2,4,6]},
{"id":11,"type":"single","question":"Возможно ли напрямую измерить механические свойства пород, пластовые давления и напряжения по каротажным данным?","options":["Возможно, при проведении АКШ","Возможно, при проведении полного комплекса ГИС с корреляцией с лабораторными исследованиями","Невозможно, каротажные приборы не измеряют напрямую данные параметры"],"answer":[2]},
{"id":12,"type":"multi","question":"Выберите основные данные для построения профиля напряжений в симуляторе РН-ГРИД по данным ГИС","options":["Глубина пласта (кровля/подошва)","Литология (литотипы)","Минимальное горизонтальное напряжение (градиент напряжения)","Коэффициент Пуассона","Модуль Юнга","Каротажные данные (ГК, ПС, пористость, проницаемость и т.д.)","Вертикальное напряжение (градиент напряжения)","Максимальное горизонтальное напряжение (градиент напряжения)","Пластовое давление (градиент давления)","Коэффициент пороупругости Био"],"answer":[1,2,3,4,5,8]},
{"id":13,"type":"multi","question":"Выберите основные данные для построения профиля напряжений в симуляторе РН-ГРИД по формуле Итона","options":["Глубина пласта (кровля/подошва)","Литология (литотипы)","Минимальное горизонтальное напряжение (градиент напряжения)","Коэффициент Пуассона","Модуль Юнга","Каротажные данные (ГК, ПС, пористость, проницаемость и т.д.)","Вертикальное напряжение (градиент напряжения)","Максимальное горизонтальное напряжение (градиент напряжения)","Пластовое давление (градиент давления)","Коэффициент пороупругости Био","Тектоническое напряжение"],"answer":[0,3,4,6,8,9,10],"explain":"Примечание: При увеличении чистого давления, модуля Юнга увеличивается высота трещины. При увеличении пластового давления и к-та Пуассона – уменьшается высота трещины. Грубая прикидка по формуле Итона: σhmin = 0.5*σz + 0.5*Pпл"},
{"id":14,"type":"single","question":"На основе каких данных предпочтительнее выделение литотипов (механотипов) в симуляторах ГРП?","options":["На основе комплекса каротажных данных ГИС","На основе интерпретации данных по литологии (РИГИС)","На основе каротажей пористости и проницаемости"],"answer":[0]},
{"id":15,"type":"single","question":"Какой из каротажей является основным для построения профиля напряжений в терригенных породах?","options":["НГК","ПС","ГК"],"answer":[2]},
{"id":16,"type":"single","question":"Какой из вариантов построения геомеханической модели без калибровки трещины по высоте является более достоверным?","options":["Геомеханическая модель на основе данных ГИС и исследований керна","Геомеханическая модель на основе данных ГИС и исследований керна, данных миниГРП","Любая геомеханическая модель без калибровки трещины по высоте не может считаться достоверной"],"answer":[1]},
{"id":17,"type":"multi","question":"Какой из перечисленных ниже параметров в симуляторе ГРП имеет наибольшее влияние на геометрию трещины?","options":["Геомеханические модули – коэффициент Пуассона и модуль Юнга","Реологические коэффициенты п' и к'","Профиль напряжения","Настройки сетки симулятора"],"answer":[1,2]},
{"id":18,"type":"single","question":"Какие неньютоновские жидкости используются в ГРП?","options":["Реопексные","Дилатантные","Псевдопластичные"],"answer":[2]},
{"id":19,"type":"single","question":"Какое утверждение верно для псевдопластичных жидкостей?","options":["При увеличении скорости сдвига вязкость жидкости уменьшается","При увеличении скорости сдвига вязкость жидкости увеличивается","При увеличении скорости сдвига вязкость жидкости остается неизменной"],"answer":[0]},
{"id":20,"type":"multi","question":"Выберите причины, из-за которых поведение сшитых жидкостей может не соответствовать степенному закону на НТНР реометрах","options":["Высокая температура","Низкая концентрация полимера","Низкая концентрация сшивателя"],"answer":[0,1,2]},
{"id":21,"type":"single","question":"При отклонении сшитых жидкостей от степенного закона какие значения принимает реологический коэффициент п'?","options":["0 < п' < 1","1 ≤ п'","п' > 1"],"answer":[0]},
{"id":22,"type":"single","question":"Зависит ли получаемая при проектировании геометрия трещины от симулятора ГРП?","options":["Зависит, так как во всех симуляторах используются различные математические модели","Не зависит, если используется единый профиль напряжений и реология жидкостей","Не зависит, если абсолютно все входные параметры идентичны"],"answer":[0],"explain":"Примечание: аналитические модели: PKN и KGD, эллипсоидальные модели, сеточные модели"},
{"id":23,"type":"single","question":"Какая модель трещины используется в симуляторе РН-ГРИД?","options":["Двумерная (2D)","Псевдотрехмерная (P3D)","Плоская трехмерная (Planar3D)"],"answer":[2],"explain":"Примечание: трещина остается плоской, но все три направления рассчитываются из реологии и геомеханики, и считаются за один проход (одномоментно и одним алгоритмом). В двумерной модели считаются полудлина и высота – ширина как корреляция. В одномерной модели высота фиксирована, полудлина – расчетная x-ка, ширина – корреляция от полудлины"},
{"id":24,"type":"single","question":"Какой из механизмов ограничения высоты трещины, не использующийся в теории геомеханики, учитывается в симуляторе РН-ГРИД?","options":["Сложное напластование","Контраст модулей сдвига","Скольжение по границе напластования"],"answer":[0]},
{"id":25,"type":"single","question":"Что происходит с трещиной при ее распространении из пласта с низким модулем Юнга в пласт с высоким модулем Юнга (в реальных условиях)?","options":["Рост трещины останавливается","Уменьшается ширина трещины","Увеличивается ширина трещины"],"answer":[1],"explain":"Примечание: Пример: модуль Юнга в песчанике больше, чем в глинах. Но омин в песчанике много меньше, чем в глинах. В этом вопросы мы предполагаем, что минимальные напряжения в песчанике и глине равны. Напряжение – более приоритетная характеристика, чем модуль Юнга."},
{"id":26,"type":"single","question":"Какой из механизмов ограничения роста трещины по высоте является доминирующим (по исследованиям в реальных условиях)?","options":["Различие модулей сдвига","Сложное напластование","Контраст напряжений"],"answer":[2]},
{"id":27,"type":"single","question":"Определите основную цель проведения комплекса тестовых закачек (миниГРП)","options":["Получение критических параметров пласта для последующей добычи","Получение критических параметров для проектирования и достижения успешного размещения пропанта во время операций по ГРП","Получение критических параметров пласта для последующей разработки месторождения"],"answer":[1],"explain":"Примечание: критические параметры: чистое давление (разница между ISIP и давлением закрытия-т.е. давление, которое держит трещину открытой), эффективность жидкости, доп.парам: перепад, град.на преодоление трения в приствольной зоне."},
{"id":28,"type":"multi","question":"Выберите основные параметры, определяемые на миниГРП","options":["Давление закрытия трещины","Пластовые напряжения или контраст напряжений","Эффективность жидкости","Высота трещины","Горное давление"],"answer":[0,2]},
{"id":29,"type":"single","question":"Как определяется эффективное смыкающее напряжение на пропант?","options":["Суммарное напряжение на пропант равно давлению закрытия трещины","Суммарное напряжение на пропант равно максимальному пластовому напряжению","Суммарное напряжение на пропант равно давление закрытия трещины минус забойное давление при работе скважины"],"answer":[2],"explain":"Примечание: Рзатрещ – Рзаб = σмин - Рзаб. Чем больше насыщение пласта, тем большую часть давления берет на себя жидкость. В ПЗП наибольшие перепады давления."},
{"id":30,"type":"single","question":"Как определяется эффективное (чистое) давление?","options":["Забойное значение ISIP минус давление закрытия трещины","Забойное значение ISIP минус пластовое давление","Забойное значение ISIP минус суммарное напряжение на пропант"],"answer":[0]},

{"id":82,"type":"multi","question":"В каких целях проводится стандартный нагнетательный тест на линейном геле, в объеме, превышающим объем скважины (замещение)? (несколько вариантов ответа)","options":["Определение приемистости скважины","Определение герметичности пакера","Оценка суммарных потерь давления в ПЗП и перфорации","Определение давления закрытия трещины","Охлаждение ПЗП в высокотемпературных скважинах"],"answer":[2,3,4],"explain":"Примечание: Линейный гель ближе к ньютоновской жидкости, чем сшитый, поэтому лучше передает давление от забоя на устье. По нему можем определить дополнительные потери давления. Если трещина не прорывается в нижележащий/вышележащий пласт, то Рсмык (на замещении и на основном ГРП одинаково)=Pmin. Выхолаживание пласта производим, чтобы сшитый гель не слишком быстро разложился (если пласт высокотемпературный)."},
{"id":83,"type":"single","question":"Трещина, возникающая при гидроразрыве пласта на глубине 1000м (1 вариант ответа)","options":["перпендикулярна вертикальному горному напряжению","перпендикулярна максимальному горному напряжению","направление зависит от дизайна и применяемой технологии ГРП","перпендикулярна минимальному горизонтальному напряжению"],"answer":[3],"explain":"Примечание: до 600 м трещина горизонтальная, 600-700 м переходная зона, глубже 700 м – трещина перпендикулярна минимальному горизонтальному напряжению"},
{"id":84,"type":"single","question":"Основной особенностью одномерных моделей развития трещины ГРП (PKN, KGD) является:","options":["Предположение постоянной высоты трещины","Предположение, что отношение высоты трещины к её длине является малой величиной","Ширина трещины не зависит от скорости закачки","Жидкость ГРП является ньютоновской жидкостью"],"answer":[0],"explain":"Примечание: PKN – Перкинса, Керна, Нордгрена. KGD – Христиановича, Гиртсма, деКлерка. PKN модель в сечении представляет из себя эллипс. Используется, когда высота трещины значительно больше ее длины. KGD модель в сечении представляет прямоугольник. Используется, когда длина трещины значительно больше высоты. Можно представить как раскрывающуюся книжку: высота листа=трещины постоянна. Меняется полудлина и ширина. Кончик трещины не смачивается жидкостью мениск четко прослеживается, эта модель позволяет оценить концевые эффекты (отставание смачиваемости от раскалывания породы, то есть какие экстраусилие нужно приложить, чтобы продолжить раскалывание). Разница между давлением инициации трещины и давлением распространения трещины – концевые эффекты."},
{"id":85,"type":"multi","question":"Укажите основные методы прямых измерений для определения минимального горизонтального напряжения? (несколько вариантов ответа)","options":["Расширенный тест на утечку (XLOT)","МикроГРП (MDT)","Пошаговый тест на увеличение расхода (SRT)","МиниГРП (DataFRAC)"],"answer":[1,3],"explain":"Примечание: MDT – ищем несколько точек, DataFRAC – ищем только одну точку закрытия (по чистому коллектору). LOT отличается на величину, описывающую концевые эффекты."},
{"id":86,"type":"open","question":"Для чего нужна смесительная установка и станция управления ГРП","image":"q86.PNG","answer_text":"Ответ: В смесительную установку может входить блендер (смешивает линейный гель, пропант и сшиватель, подает на насосы высокого давления), гидратационная установка (устройство для непрерывной гидратации полимера во время ГРП), хим.машина (для добавления доп. реагентов). На станции управления все данные со всех датчиков выводятся на единое устройство (в график). Часто совмещена с полевой лабораторией и с управлением насосами высокого давления."},
{"id":77,"type":"single","question":"Что не является целью при проведении анализа давления после остановки закачки посредством G-функции (1 вариант ответа)","options":["Давление развития трещины","давление смыкания трещины","характер утечки жидкости ГРП в пласт","характер рецессии высоты трещины"],"answer":[0],"explain":"Примечание: давление развития трещины мы определяем во время Step-rate теста (первые точки-с очень маленьким расходом, чтобы жидкость просто фильтровалась через матрицу. Через эти точки можно построить график зависимости скорости фильтрации жидкости от рабочего давления. Следующее облако точек – когда уже развилась трещина и фильтрация идет через нее, а не через матрицу. На пересечении двух касательных мы находим давление распространения трещины! Редкий тест: Step-down-pressure (определение к-та трения на каждой ступеньке через узловой анализ). Эти исследования цены для накопления, а не здесь и сейчас! Рисунок q77.PNG"},

{"id":88,"type":"multi","question":"Выберите 3 признака увеличения и сокращения длины трещины при неидеальном поведении закрытия (несколько вариантов ответа)","options":["Площадь фильтрации постоянно изменяется","Высота трещины не изменяется, изменяется длина и ширина","Единственный угол наклона кривой падения давления","Постоянное значение производной dP/dG","Давление в начале быстро снижается с последующим замедлением"],"answer":[0,1,4],"explain":"Примечание: трещина смыкается с изменением площади фильтрации, что вносит свои погрешности. Знать графики анализа мини-ГРП (нормальное смыкание, трещина в барьере, естественная трещиноватость, рост трещины после остановки насоса)"},
{"id":89,"type":"open","question":"Для чего нужен блок манифольдов и насосы высокого давления флота ГРП","image":"q89.PNG","answer_text":"Примечание: Блок манифольдов - для соединения линий нагнетания насосных агрегатов высокого давления с устьевой арматурой ГРП. На гребёнке высокого давления БМ должен быть установлен датчик высокого давления (до 105,0 МПа) с выводом показаний в станцию управления процессом. Насосные агрегаты высокого давления в сумме должны обеспечивать бесперебойную закачку технологической жидкости в скважину с темпом закачки до 7,5 м3/мин и с максимальным давлением до 105,0 МПа. Суммарная гидравлическая мощность насосных агрегатов комплекса ГРП обычно составляет не менее 8900 л.с."},

{"id":93,"type":"open","question":"Для чего нужен песковоз и гидратационная установка во флоте ГРП?","image":"q93.PNG","answer_text":"Примечание: песковоз – для подачи расклинивающего материала (пропанта) на приемный ковш смесительной установки. Гидратационная установка предназначена для приготовления концентрированного объёма жидкого полимера и подачи его непосредственно в линию закачки во время процесса ГРП."},

{"id":97,"type":"open","question":"Какой режим утечек виден по графику? Почему вы так решили?","image":"q97.PNG","answer_text":"Примечание: Нормальное смыкание (нормальная утечка) - Normal Leak-off. Площадь гидравлической трещины постоянна во время закрытия и утечка происходит в однородную матрицу породы. Поэтому что полулогарифмическая производная GdP/dG ложится на прямую через начало координат. Отклонение от прямой – смыкание трещины."},

{"id":101,"type":"open","question":"Какой режим утечек виден по графику? Почему вы так решили?","image":"q101.PNG","answer_text":"Примечание: сначала сомкнулись естественные трещины, затем основное тело трещины. Утечки, зависящие от давления (вторичные трещины) - Pressure Dependant Leak-off. Поэтому что над прямой через начало координат видим «горб». Конец горба – давление закрытия естественных трещин, затем некоторый период нормальной утечки, отклонение от прямой – смыкание трещины."},
{"id":102,"type":"multi","question":"Какой из перечисленных ниже параметров в симуляторе ГРП имеет наибольшее влияние на геометрию трещины? (2 вариант ответа)","options":["Геомеханические модули – коэффициент Пуассона и модуль Юнга","Реологические коэффициенты п’ и k’","Профиль напряжения","Настройки сетки симулятора"],"answer":[1,2]},

{"id":105,"type":"open","question":"Какой режим утечек виден по графику? Почему вы так решили?","image":"q105.PNG","answer_text":"Примечание: Снижение высоты трещины - Fracture Height Recession. Это случай, когда трещина вошла в непроницаемые барьеры, примыкающие к кровле и подошве продуктивного пласта. После остановки закачки, трещина сначала смыкается в непроницаемых слоях, имеющих более высокое напряжение, и только затем в проницаемых слоях. Поэтому что видим характерный прогиб под прямой из начала координат. Отклонение от прямой указывает на смыкание трещины. А также вогнутость вниз кривой GdP/dG. Вначале давление падает с постоянной скоростью, которая сравнительно мала, по той причине, что только проницаемая площадь вызывает утечку жидкости из объема трещины. Затем непроницаемая часть трещины начинает смыкаться (уменьшение высоты), во время этого периода скорость падения давления увеличивается. К концу смыкания трещина состоит только из проницаемой площади, во время этого периода скорость падения давления снова оказывается постоянной (нормальная утечка), но имеет большую величину, чем начальная утечка."},

{"id":110,"type":"open","question":"Напишите и поясните формулу Итона","image":"q110.PNG","answer_text":"Примечание: Полное вертикальное напряжение, σv, по сути, равно силе, определяемой весом покрывающих горных пород, действующей на единицу площади пласта. Формально это интеграл плотности горных пород, расположенных над пластом. На практике, эта величина составляет от 0,22 до 0,25 атмосферы на метр глубины и обычно в отсутствии более точных данных принимается равной 0,23 атм/м."},
{"id":111,"type":"open","question":"Что такое меш?","answer_text":"Примечание: В промысловой практике для обозначения размера фракции пропанта принята единица измерения – «меш» (англ. mesh – петля, ячейка, отверстие сита) – внесистемная единица измерения размеров ячеек проволочных сеток (сит), а также размера частиц сыпучих тел. Меш указывает на количество отверстий сетки на 1 линейный дюйм (25,4 мм). При расчёте фактического размера отверстий необходимо учитывать диаметр (или калибр) проволоки. Например, для пропанта размерность 20/40 меш обозначает, то что пропант полностью проходить через сито 20 меш и задерживается на сите 40 меш."},
{"id":112,"type":"open","question":"Жидкости гидроразрыва условно можно разделить на:","answer_text":"Примечание: Жидкости гидроразрыва условно можно разделить на: Приготовленные на основе нефти; Приготовленные на основе воды; Вспененные системы на основе нефти или воды, где в качестве дисперсной фазы применяют азот или углекислый газ. В настоящее время подавляющее количество гидроразрывов пласта проводят с применением жидкостей на водной основе. Вспененные системы на основе нефти или воды используют как правило в чувствительных к воде или истощенных (с низким давлением) пластах."},
{"id":113,"type":"open","question":"Как взаимодействуют сшиватель и гуар с химической точки зрения?","answer_text":"Примечание: Для придания большей вязкости и, следовательно, большей песко-несущей способности, в качестве агента загустителя в жидкостях гидроразрыва используют производные гуара: гидроксипропилгуар (HPG) и карбоксиметил-гидроксипропилгуар (CMHPG). Гуар и его производные реагируют с металлом, что позволяет увеличивать вязкость базового геля в 5 – 100 раз (за счет “сшивания” длинных цепочек нитей полимера) в широком интервале скоростей сдвига, существенных для гидроразрыва. В качестве сшивающего элемента обычно используют бор (В), далее идут органометаллические сшиватели, такие как цирконий (Zr), титан (Ti) и в меньшей степени сурьма (Sb) и алюминий (Al)."},
{"id":114,"type":"open","question":"От чего зависят типы добавок к жидкости гидроразрыва?","answer_text":"Примечание: добавки к жидкости гидроразрыва – это материалы, используемые для придания флюиду специфического эффекта, независимо от типа жидкости. Тип и концентрации используемых добавок сильно зависят от пластовой температуры, литологии и пластовых флюидов."},
{"id":115,"type":"open","question":"Зачем нужны бактерициды?","answer_text":"Примечание: Бактерициды (биоциды) борются с бактериальным загрязнением. В большинстве случаев вода, используемая для приготовления жидкостей гидроразрыва содержит бактерии, попадающие в нее либо из загрязненного источника водоснабжения, либо из емкостей для хранения воды на месте проведения работ. Бактерии выделяют ферменты, которые могут очень быстро разрушить вязкость. С бактериями можно эффективно бороться путем поднятия рН до уровня выше 12, добавкой хлорной извести, либо путем применения биоцида широкого спектра действия."},
{"id":116,"type":"open","question":"Зачем нужен понизитель утечек?","answer_text":"Примечание: Понизители утечек обеспечивают контроль фильтрации жидкости гидроразрыва. Представляет собой, как правило, порошок с размером частиц от 0,1 до 50 микрон. Наиболее эффективным из недорогих материалов является молотый кварцевый песок. Также могут использоваться крахмалы, камеди, смолы, мыла, обладающие тем преимуществом что они позволяют провести очистку созданной трещины гидроразрыва после обработки благодаря своей растворимости в воде."},
{"id":117,"type":"open","question":"Зачем нужен деструктор?","answer_text":"Примечание: Деструкторы понижают вязкость путем разрушения структурных связей молекул гуарового полимера, благодаря чему они имеют потенциал весьма значительного улучшения очистки и увеличения дебита скважины после проведения гидроразрыва."},
{"id":118,"type":"open","question":"Зачем нужен деэмульгатор?","answer_text":"Примечание: Деэмульгатор (ПАВ-регулятор) препятствует образованию эмульсий, снижает поверхностное натяжение и изменяет смачиваемость (т.е. гидрофильность). Снижение поверхностного натяжения улучшает последующее освоение скважины после ГРП."},
{"id":119,"type":"open","question":"Зачем нужен пенообразователь?","answer_text":"Примечание: Пенообразователи обеспечивают поверхностно-активную стабилизацию что необходимой для удержания газа в тонкодисперсной форме в пенных жидкостях гидроразрыва. Эти ионные материалы также действуют как поверхностно-активные вещества и эмульгаторы. Стабильные пены не могут быть приготовлены без стабилизации при помощи ПАВ."},
{"id":120,"type":"open","question":"Зачем нужны добавки для стабилизации глин?","answer_text":"Примечание: Добавки для стабилизации глин обеспечивают временную или постоянную совместимость жидкости гидроразрыва с глинистыми минералами, содержащимися в пласте. Обычно применяются растворы, содержащие от 1 до 3 процентов KCl или других солей. В настоящее время применяются органические заменители, применяемые в меньших концентрациях."},
{"id":121,"type":"multi","question":"На основе каких кислот могут проводить кислотный ГРП? (газовые) — выберите 2 базовые кислоты","options":["хлористоводородная HCl","уксусная CH3COOH","фтористоводородная HF","сульфаминовая NH2SO3H","серная H2SO4","глинокислота (HCl+HF)"],"answer":[0,2],"explain":"Примечание: в состав кислотных составов могут входить различные химические реагенты, а также органические и неорганические кислоты и их смеси: уксусная CH3COOH, сульфаминовая NH2SO3H, серная H2SO4, а также глинокислота (HCl+HF). Все кислоты и химические реагенты, используемые на месторождениях Компании, должны строго соответствовать ГОСТам или ТУ завода-изготовителя. Кроме этого, перед использованием все кислоты, кислотные составы и химические реагенты должны пройти обязательный входной контроль качества в аккредитованной химической лаборатории. Товарные формы химических реагентов отечественного производства, применяемые на объектах добычи нефти и газа ОГ, должны иметь следующий комплект сопроводительной документации: ГОСТ, технические условия или стандарт на продукцию; Инструкцию по применению; Сертификат соответствия требованиям охраны труда и промышленной безопасности. Товарные формы реагентов зарубежного производства, применяемые на объектах добычи нефти и газа ОГ, должны иметь следующий комплект сопроводительной документации: Паспорт безопасности вещества (Material Safety Data Sheet); Спецификацию на поставку с указанием номера контракта; Техническую информацию (инструкцию по применению); Сертификат соответствия требованиям охраны труда и промышленной безопасности."},
{"id":122,"type":"open","question":"Типовой комплекс оборудования для проведения гидравлического разрыва пласта включает в себя:","answer_text":"Примечание: Смесительную установку; Насосные агрегаты высокого давления (обычно от двух до четырех); Станцию сбора данных и управления процессом; Песковоз; Блок манифольдов; Гидратационную машину (опционно); Емкости для жидкости ГРП."},
{"id":123,"type":"open","question":"Основные технологические узлы смесительной установки:","answer_text":"Примечание: Миксер (чан) для смешивания жидкости гидроразрыва с пропантом, оснащённый системой ручного и автоматического контроля уровня в миксере во время работы смесителя; Центробежные насосы с производительностью до 9,5 м3/мин установленных: один для приёма жидкости в миксер из технологических ёмкостей, второй для подачи (подпор) из миксера к насосным агрегатам. Управление центробежными насосами должно обеспечивать работу насосов как одновременно, так и по отдельности; система управления должна включать ручной и автоматический режим (от бортового компьютера); Перепускная линия для закачки кислотных смесей без использования миксера; Шнеки (не менее 2-х) для подачи закрепляющего материала (песок, пропант) в миксер с производительностью до 6 т/мин каждый оснащённых системой ручного и автоматического управления; Приёмный ковш для расклинивающего материала. Высота верхнего среза ковша в технологическом положении не должна превышать 0,8 метра; Система дозированной подачи жидких и сухих химических реагентов, оснащенная ручным и автоматическим управлением; Расходомеры (турбинные, электромагнитные) на линии приёма и подачи технологической жидкости с возможностью вывода показаний на панель управления смесительной установки; Радиоизотопный плотномер для контроля концентрации расклинивающего материала на выходе из смесителя с возможностью вывода показаний на панель управления смесительной установки; Блок электроники для передачи показаний технологических параметров со смесительной установки в блок сбора данных и управления процессом (станция управления); Бортовой компьютер для автоматического управления системой подачи расклинивающего материала и хим.реагентов приготовления жидкости разрыва."},
{"id":124,"type":"open","question":"Чем должны быть оборудованы насосные агрегаты высокого давления?","answer_text":"Примечание: Системой дистанционного управления смонтированного в станции управления процессом; Системой автоматической остановки нагнетания по заданному предельному давлению; Системой сброса давления из линий нагнетания с дистанционным управлением; Панелью управления с отражением параметров работы насоса: темп закачки, давление нагнетания, передача скорости на силовом приводе, режимные параметры работы силового привода, причины неисправности; Защитным покрытием плунжеров для возможности закачки кислотных составов."},
{"id":125,"type":"open","question":"Оснащённость станции управления по современным требованиям мониторинга процесса ГРП должна включать в себя:","answer_text":"Примечание: При проведении процесса ГРП все технологические параметры со смесительной установки и линий нагнетания поступают в станцию управления и сбора данных по электрическим кабелям или беспроводному соединению. Систему электропитания 220В 50Гц которая должна включать электрический генератор мощностью 24 кВА с приводом от дизельного двигателя (с системой предварительного подогрева), модуль бесперебойного питания мощностью 1400 ВА, смонтированный в 19-дюймовой стойке, рассчитанный приблизительно на 45 минут работы, блок автоматов защиты и электропроводку; Иметь возможность приёма не менее 60 каналов регистрации параметров технологического процесса. Панели управления должны позволять управлять насосными агрегатами ГРП, отображать все необходимые данные о работе смесителя, установки дозирования химреагентов и задавать необходимые параметры их работы; Блок обработки поступающих внешних данных и отображения с помощью интерфейса оператора, а также передачи на внешний портативный компьютер или внутренний модуль памяти с выводами информации на компьютеры; Возможность хранения данных в блоке обработке с нескольких процессов ГРП, используя модули флэш-памяти; Отображение на панели блока обработки не менее 20 технологических параметров; Два взаимозаменяемых компьютера промышленного исполнения: один компьютер для целей сбора данных, а другой для целей моделирования; Спутниковую связь (желательно) для передачи данных и связи с базой из районов с неразвитой сетью сотовой связи; Систему связи персональных раций короткого радиуса действия для применения на рабочих площадках для рабочего персонала ГРП. Две базовые рации и 16 персональных носимых раций в комплекте с наушниками и микрофонами смонтированными на защитных касках. Цветной принтер и сканер для вывода технологических планов обработки и предоставления отчётов по процессу контролирующим представителям Заказчика."},
{"id":126,"type":"single","question":"Что из себя представляют давление и время смыкания?","options":["минимальное горизонтальное напряжение, эффективность жидкости ГРП и суммарный коэффициент утечки","максимальное горизонтальное напряжение в коллекторе, эффективность жидкости ГРП и суммарный коэффициент утечки","минимальное горизонтальное напряжение в коллекторе, эффективность жидкости ГРП и суммарные потери на трение"],"answer":[0],"explain":"Примечание: Давление смыкания представляет собой минимальное горизонтальное напряжение в коллекторе пласта, и после своего определения заносится в программный симулятор ГРП при создании 1D-геомеханической модели. Время смыкания характеризует эффективность жидкости ГРП и суммарный коэффициент утечки. Полученный при минифраке коэффициент утечки также учитывается при создании 1D-геомеханической модели. После определения этих ключевых параметров, путем калибровки давления настраиваются (адаптируются) все остальные параметры, влияющие на процесс."},

let queue = [], idx = 0, current = null, selected = [];
let wrongIds = JSON.parse(localStorage.getItem('grp_wrong') || '[]');
let correctCount = 0;
const $ = (id) => document.getElementById(id);

function buildSidebar() {
  const list = $('q-list');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const li = document.createElement('li');
    li.textContent = `${q.id}. ${q.question.substring(0, 30)}...`;
    li.title = q.question;
    li.onclick = () => {
      $('start-screen').hidden = true;
      $('result-screen').hidden = true;
      $('quiz-screen').hidden = false;
      queue = [q];
      idx = 0;
      render();
      if (window.innerWidth <= 768) $('sidebar').classList.remove('open');
    };
    list.appendChild(li);
  });
}

function updateSidebarActive() {
  const items = $('q-list').querySelectorAll('li');
  items.forEach(li => li.classList.remove('active'));
  if (current && queue.length === 1) {
    const index = QUESTIONS.findIndex(q => q.id === current.id);
    if (index !== -1) items[index].classList.add('active');
  }
}

function start() {
  const mode = $('mode').value;
  let pool = QUESTIONS.slice();
  if (mode === 'single') pool = pool.filter(q => q.type === 'single');
  if (mode === 'multi')  pool = pool.filter(q => q.type === 'multi');
  if (mode === 'open')   pool = pool.filter(q => q.type === 'open');
  if (mode === 'wrong')  pool = pool.filter(q => wrongIds.includes(q.id));
  if (!pool.length) { alert('Нет вопросов для выбранного режима'); return; }
  queue = shuffle(pool); idx = 0; correctCount = 0;
  $('start-screen').hidden = true;
  $('result-screen').hidden = true;
  $('quiz-screen').hidden = false;
  render();
}

function render() {
  current = queue[idx];
  selected = [];
  $('q-counter').textContent = `Вопрос ${idx + 1} из ${queue.length}`;
  $('q-type').textContent = typeLabel(current.type);
  $('q-text').textContent = current.question;
  
  const imgContainer = $('q-image-container');
  imgContainer.innerHTML = '';
  if (current.image) {
    const img = document.createElement('img');
    img.src = current.image;
    img.className = 'q-img';
    imgContainer.appendChild(img);
  }

  $('q-feedback').hidden = true;
  $('next-btn').hidden = true;
  $('check-btn').hidden = false;
  $('check-btn').disabled = false;
  $('skip-btn').hidden = false;

  const box = $('q-options');
  box.innerHTML = '';

  if (current.type === 'open') {
    const ta = document.createElement('textarea');
    ta.id = 'open-answer';
    ta.placeholder = 'Ваш ответ…';
    box.appendChild(ta);
    updateSidebarActive();
    return;
  }
  current.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = () => toggleOption(i, b);
    box.appendChild(b);
  });
  updateSidebarActive();
}

function toggleOption(i, btn) {
  if (current.type === 'single') {
    selected = [i];
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    btn.classList.add('selected');
  } else {
    const pos = selected.indexOf(i);
    if (pos === -1) { selected.push(i); btn.classList.add('selected'); }
    else { selected.splice(pos, 1); btn.classList.remove('selected'); }
  }
}

function check() {
  const fb = $('q-feedback');
  fb.hidden = false;

  if (current.type === 'open') {
    fb.className = 'feedback';
    fb.innerHTML = `<b>Эталон:</b><br>${escapeHtml(current.answer_text || '').replace(/\n/g, '<br>')}`;
    finishQuestion();
    return;
  }

  if (!selected.length) {
    fb.className = 'feedback bad';
    fb.textContent = 'Выберите вариант(ы) ответа.';
    return;
  }

  const correct = sameSet(selected, current.answer);
  document.querySelectorAll('.option').forEach((el, i) => {
    if (current.answer.includes(i)) el.classList.add('correct');
    else if (selected.includes(i)) el.classList.add('wrong');
    el.disabled = true;
  });

  if (correct) {
    correctCount++;
    fb.className = 'feedback ok';
    fb.innerHTML = '<b>Верно!</b>' + (current.explain ? `<br>${escapeHtml(current.explain)}` : '');
    removeWrong(current.id);
  } else {
    fb.className = 'feedback bad';
    const right = current.answer.map(i => current.options[i]).join('; ');
    fb.innerHTML = `<b>Неверно.</b> Правильно: ${escapeHtml(right)}` +
                   (current.explain ? `<br><br>${escapeHtml(current.explain)}` : '');
    addWrong(current.id);
  }
  finishQuestion();
}

function finishQuestion() {
  $('check-btn').hidden = true;
  $('skip-btn').hidden = true;
  $('next-btn').hidden = false;
}

function next() {
  idx++;
  if (idx >= queue.length) return showResult();
  render();
}

function showResult() {
  $('quiz-screen').hidden = true;
  $('result-screen').hidden = false;
  const total = queue.length;
  $('score').textContent =
    `Правильно: ${correctCount} из ${total} (${Math.round(correctCount/total*100)}%)`;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sameSet(a, b) {
  if (a.length !== b.length) return false;
  const A = [...a].sort(), B = [...b].sort();
  return A.every((v, i) => v === B[i]);
}
function addWrong(id) { if (!wrongIds.includes(id)) { wrongIds.push(id); saveWrong(); } }
function removeWrong(id) { wrongIds = wrongIds.filter(x => x !== id); saveWrong(); }
function saveWrong() { localStorage.setItem('grp_wrong', JSON.stringify(wrongIds)); }
function typeLabel(t) {
  return { single: 'Один ответ', multi: 'Несколько ответов', open: 'Открытый вопрос' }[t] || '';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('start-btn').onclick = start;
$('check-btn').onclick = check;
$('next-btn').onclick = next;
$('skip-btn').onclick = next;
$('restart-btn').onclick = () => {
  $('result-screen').hidden = true;
  $('start-screen').hidden = false;
};
$('menu-btn').onclick = () => $('sidebar').classList.toggle('open');

document.getElementById('total').textContent = QUESTIONS.length;
document.getElementById('start-btn').disabled = false;
buildSidebar();
</script>
